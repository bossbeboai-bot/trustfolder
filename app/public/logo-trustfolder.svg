<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TrustFolder">
  <title>TrustFolder</title>
  <defs>
    <linearGradient id="mintGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6DD5C9"/>
      <stop offset="100%" stop-color="#55BCAF"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0C2557"/>
    </linearGradient>
  </defs>
  <!-- Back navy folder -->
  <rect x="5" y="12" width="40" height="38" rx="5" fill="url(#navyGrad)" />
  <!-- Mint middle folder peeking -->
  <rect x="11" y="16" width="40" height="38" rx="5" fill="url(#mintGrad)" />
  <!-- Front navy folder with checkmark -->
  <rect x="17" y="20" width="40" height="38" rx="5" fill="url(#navyGrad)" />
  <!-- Checkmark -->
  <path d="M26 39.5 L32.5 46 L48 30" stroke="#FAFAF8" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
